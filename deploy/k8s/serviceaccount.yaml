# ServiceAccount for the pod set.
#
# The base deployment does not need this — the pods hold no cloud credentials
# and talk to nothing outside the cluster. It exists for the tls-awssm overlay,
# where an initContainer reads server certificates from AWS Secrets Manager and
# has to authenticate as something.
#
# Applying it in the base is deliberate even so: an empty ServiceAccount grants
# nothing that `default` did not already grant, and having the pods already
# running under a named account means turning on the overlay is a permissions
# change on the target environment side rather than a change to which identity the
# workload runs as.
#
# ---------------------------------------------------------------------------
# WHAT WE NEED FROM THE PLATFORM / CLOUD TEAM
#
# 1. An IAM role this ServiceAccount may assume, with a trust policy naming
#    this cluster's OIDC provider, this namespace, and this account name.
# 2. That role allowed secretsmanager:GetSecretValue on the specific secrets
#    holding the server certificate and key — nothing wider.
# 3. The role ARN, to fill in the annotation below.
#
# The permission we are asking for, as a policy document (substitute the real
# secret ARNs — the trailing wildcard covers the six-character suffix Secrets
# Manager appends to every ARN):
#
#   {
#     "Version": "2012-10-17",
#     "Statement": [{
#       "Effect": "Allow",
#       "Action": "secretsmanager:GetSecretValue",
#       "Resource": [
#         "arn:aws-iso:secretsmanager:<region>:<account>:secret:<cert-secret>-*",
#         "arn:aws-iso:secretsmanager:<region>:<account>:secret:<key-secret>-*"
#       ]
#     }]
#   }
#
# If the secrets are encrypted with a customer-managed KMS key rather than the
# default aws/secretsmanager key, the role also needs kms:Decrypt on that key.
# That is the failure that reads as AccessDeniedException on a secret the role
# demonstrably can list, and it is worth asking about up front.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ServiceAccount
metadata:
  name: imax
  labels:
    part-of: imax-chat-viewer
  # annotations:
  #   # Uncomment and set to enable IRSA. Without it the credential chain in
  #   # deploy/aws-sigv4.js falls through to the node instance profile, so the
  #   # same manifests work either way — but a node-wide permission is a worse
  #   # answer than a pod-scoped one, and this is the line that scopes it.
  #   eks.amazonaws.com/role-arn: arn:aws-iso:iam::<account>:role/<role>
# NOT setting automountServiceAccountToken: false, deliberately.
#
# These pods call no Kubernetes API, so suppressing the token would be correct
# hardening on its own terms. It is left off because IRSA's web-identity token
# arrives by a different route — a projected volume injected by the EKS
# admission webhook — and we cannot exercise that interaction anywhere we have
# access to. Shipping an untested interaction between a hardening flag and the
# one mechanism the demo depends on is a bad trade for a one-shot deployment.
# Turn it on once the overlay has been seen working in the target environment.
